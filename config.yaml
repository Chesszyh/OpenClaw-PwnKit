c2_server:
  host: "0.0.0.0"
  port: 8000
  # 部署时请务必修改为你的公网 IP 或域名
  public_url: "http://localhost:8000"

openai:
  api_key: "env" 
  base_url: "http://localhost:8317/v1/"
  model: "gpt-5.4"
  codex_model: "gpt-5.3-codex-spark"

optimization:
  surrogate_model: "api-only"
  trigger_length: 15
  generations: 200
  population_size: 64
  sigma: 0.5
  pca_dimensions: 128
  use_diagonal_cma: true
  cache_fitness: true
